<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>할 일 목록 Page</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="p-5 mb-5 text-center bg-light">
  <h1 class="mb-3">Todo List</h1>
  <h4 class="mb-4">하루하루 할 일을 기록해보자</h4>
</div>

<div class="container">
  <button type="button" id="add-todo-btn"
          th:onclick="|location.href='@{/add_todo}'|"
          class="btn btn-secondary btn-sm mb-3">할 일 등록</button>
  <div class="row-6" th:each="item : ${todoList}">  <!-- articles 갯수 만큼 반복, item 변수로 지정 -->
    <div class="card">
      <div class="card-header" th:text="${item.id}">  <!-- item의 id 출력-->
      </div>
      <div class="card-body">
        <p class="card-text" th:text="${item.completed} ? '완료' : '진행중'"
           th:classappend="${item.completed} ? ' text-primary' : ' text-warning'"></p> <!-- item의 content 출력-->
        <a th:href="@{/todos/{id}(id=${item.id})}" class="btn btn-primary">내용 보러가기</a>
      </div>
    </div>
    <br>
  </div>
</div>
<script src="/todo.js"></script>
</body>
</html>
