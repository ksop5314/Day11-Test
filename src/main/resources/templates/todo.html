<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>할 일 자세히 보기</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <div class="row">
    <div class="col-lg-8">
      <article>
        <input type="hidden" id="todo-id" th:value="${todoResponse.id}">
        <header class="mb-4">
          <h1 class="fw-bolder mb-1" th:text="${todoResponse.title}"></h1>
        </header>
        <section class="mb-5">
          <p class="fs-5 mb-4" th:text="${todoResponse.completed} ? '완료' : '진행중'"
             th:classappend="${todoResponse.completed} ? ' text-primary' : ' text-warning'"></p>
        </section>
        <button type="button" id="update-btn"
                class="btn btn-primary btn-sm">상태변경</button>
        <button type="button" id="delete-btn"
                class="btn btn-secondary btn-sm">삭제</button>
      </article>
    </div>
  </div>
</div>
<script src="/todo.js"></script>
</body>
</html>
